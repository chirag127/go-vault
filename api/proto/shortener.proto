syntax = "proto3";

package shortener.v1;

option go_package = "github.com/chirag127/go-vault/api/gen/shortener/v1;shortenerv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service ShortenerService {
  rpc CreateLink(CreateLinkRequest) returns (CreateLinkResponse) {
    option (google.api.http) = {
      post: "/v1/links"
      body: "*"
    };
  }

  rpc GetLink(GetLinkRequest) returns (GetLinkResponse) {
    option (google.api.http) = {
      get: "/v1/links/{code}"
    };
  }

  rpc Resolve(ResolveRequest) returns (ResolveResponse) {
    option (google.api.http) = {
      get: "/r/{code}"
    };
  }

  rpc Stats(StatsRequest) returns (StatsResponse) {
    option (google.api.http) = {
      get: "/v1/links/{code}/stats"
    };
  }

  rpc ListLinks(ListLinksRequest) returns (ListLinksResponse) {
    option (google.api.http) = {
      get: "/v1/links"
    };
  }

  rpc DeleteLink(DeleteLinkRequest) returns (DeleteLinkResponse) {
    option (google.api.http) = {
      delete: "/v1/links/{code}"
    };
  }
}

message CreateLinkRequest {
  string original_url = 1;
  string custom_code  = 2; // optional
  int64  ttl_seconds  = 3; // 0 = no expiry
}

message CreateLinkResponse {
  Link link = 1;
}

message GetLinkRequest {
  string code = 1;
}

message GetLinkResponse {
  Link link = 1;
}

message ResolveRequest {
  string code    = 1;
  string client_ip = 2;
}

message ResolveResponse {
  string original_url = 1;
}

message StatsRequest {
  string code = 1;
}

message StatsResponse {
  string code       = 1;
  int64  click_count = 2;
  google.protobuf.Timestamp last_accessed = 3;
}

message ListLinksRequest {
  int32  page_size  = 1;
  string page_token = 2;
}

message ListLinksResponse {
  repeated Link links          = 1;
  string        next_page_token = 2;
}

message DeleteLinkRequest {
  string code = 1;
}

message DeleteLinkResponse {
  bool deleted = 1;
}

message Link {
  string code         = 1;
  string original_url = 2;
  int64  click_count  = 3;
  google.protobuf.Timestamp created_at  = 4;
  google.protobuf.Timestamp expires_at  = 5;
}
